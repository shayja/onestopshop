name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 bundles npm 10, which silently ignores the allowScripts
      # gate (npm >= 11.19) that .npmrc's strict-allow-scripts enforces.
      - run: npm install -g npm@">=11.19 <12"

      - run: npm ci

      - run: npm run build
